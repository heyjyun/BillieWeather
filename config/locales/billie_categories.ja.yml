        quota: AI サービスのクレジットが不足しているか混雑しています。何も変更されていません。
        failed: AI サービスがこれらの取引を分類できませんでした。何も変更されていません。後でもう一度お試しください。
        unavailable: AI サービスに接続できませんでした。何も変更されていません。後でもう一度お試しください。
        invalid_result: AI サービスから予期しない応答がありました。何も変更されていません。もう一度お試しください。
