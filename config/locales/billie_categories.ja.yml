        other: AI が %{sent} 件の加盟店を確認し、%{count} 件の取引を分類しました。
      ai_remaining:
        one: まだ %{count} 件の加盟店が残っています。もう一度実行すると続けます。
        other: まだ %{count} 件の加盟店が残っています。もう一度実行すると続けます。
      errors:
        blank: カテゴリ名を入力してください。
        too_long: カテゴリ名は %{count} 文字までです。
        reserved: それは組み込みのカテゴリです。
        taken: 同じ名前のカテゴリがすでにあります。
        too_many: 独自のカテゴリは %{count} 個までです。
