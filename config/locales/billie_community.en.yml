        title: Features & Membership
        eyebrow: FEATURES & MEMBERSHIP
        heading: What BillieWeather does, and who it's built with
        intro: A plain look at the tools inside BillieWeather, how they work, and the community badges that thank the people helping it grow.
      features:
        eyebrow: PRODUCT FEATURES
        heading: Everything in one calm workspace
        dashboard_title: Financial Dashboard
        dashboard_body: See income, spending, balances, and recent activity across your uploaded accounts on one page.
        categorization_title: Smart Categorization
        categorization_body: Transactions are sorted into categories automatically, and the rules you correct are remembered next time.
        forecasting_title: Cash Flow Forecasting
        forecasting_body: Estimate where your balance may be heading in the coming weeks, and test what-if changes to income or spending.
        insights_title: AI Financial Insights
        insights_body: Ask for a plain-language explanation of your spending patterns. AI analysis only runs when you request it.
        tax_title: Tax Preparation Assistance
        tax_body: Organize the records and questions to bring to tax time. It is a checklist helper, not tax advice or filing.
      how:
        eyebrow: HOW BILLIEWEATHER WORKS
        heading: Numbers from code, words from AI
        intro: Each part of BillieWeather does the job it is best at, so the figures you see can be traced back to your own records.
        ai_title: Natural-language explanations
        ai_body: BillieWeather currently uses OpenAI GPT models to answer in natural language and explain your finances, only when you ask for an AI analysis.
        forecast_title: Forecasts from your own history
        forecast_body: Cash flow forecasts are based on your past transactions, your income and spending trends, and the scenarios you set yourself.
        models_title: Forecasting models
        models_body: You can choose Prophet, Chronos-2, or a simple historical-average baseline. We keep evaluating which models forecast personal cash flow best.
        numbers_title: Calculation kept separate from explanation
        numbers_body: Every number is calculated by our own code first. The language model only explains figures that were already computed, so it is never asked to make up your financial numbers.
