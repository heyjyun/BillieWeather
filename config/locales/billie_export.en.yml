      confirmation_mismatch: The email you typed doesn't match your account, so nothing was deleted.
      backups_note: Data is removed from BillieWeather right away. Copies in encrypted database backups are not erased immediately; they expire on the hosting provider's backup schedule. Information previously sent to the optional AI insights or forecasting services follows those providers' retention policies.
