          title: スキャンと取り込み
          body: レシートの写真、スクリーンショット、PDF。文字は端末上または PDF から読み取り、ルールで項目を認識します。
          rules: 既存の銀行取引と完全かつ一意に一致する場合は自動で関連付けます。確認するまで、レシートから新しい取引が作られることはありません。
