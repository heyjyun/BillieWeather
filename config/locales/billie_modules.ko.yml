        transactions_sections: 거래 영역
      sections:
        overview: 개요
        all_transactions: 전체 거래
        add_sync: 추가 및 동기화
        statements: 명세서
        receipts: 영수증
        reconciliation: 대사
        review_history: 검토 및 기록
      names:
        transactions: 거래
        ai_assistant: AI 도우미
        ledgers: 장부
        accounts: 계좌 및 자산
        categories: 카테고리 및 태그
        budgets: 예산
        reports: 보고서
        recurring: 정기 거래 및 청구서
        goals: 목표 및 계획
        household: 가족 공유
        forecast: 현금 흐름 예측
        multi_currency: 다중 통화
      descriptions:
        transactions: 개요, 모든 거래, 새 거래 추가 및 가져오기.
        ai_assistant: 분석, 내 돈에 대한 질문, 세금 준비, 기록 정리 도움.
        ledgers: 개인, 사업, 공동 지출을 위한 별도의 장부.
        accounts: 계좌, 잔액, 자산, 부채 및 순자산.
        categories: 카테고리 트리, 가맹점, 프로젝트 및 태그.
        budgets: 알림이 있는 월간 및 연간 예산.
        reports: 카테고리·계좌·월별 보고서, 순자산, 내보내기.
        recurring: 일정에 따라 기록되는 정기 수입, 청구서, 구독.
        goals: 저축 목표와 큰 지출 계획.
        household: 가족과 장부 공유.
        forecast: 앞으로 30, 60, 90일의 예상 잔액.
        multi_currency: 여러 통화의 계좌를 보고서용으로 환산.
      status:
        available: 사용 가능
        coming_soon: 출시 예정
        enabled: 켜짐
        disabled: 꺼짐
        core: 기본
      library:
        nav: 기능 라이브러리
        eyebrow: 설정
        title: 기능 라이브러리
        intro: 사이드바에 표시할 항목을 고르세요. 간단하게 시작하고 필요할 때 도구를 추가하세요.
        filters_label: 모듈 표시
        filters:
          all: 전체
          enabled: 켜짐
          available: 사용 가능
          coming_soon: 출시 예정
        toggle_label: 사이드바에 %{name} 표시
        turn_on: 켜기
        turn_off: 끄기
        open: 열기
        saved_on: "%{name}을(를) 켰고 사이드바에 표시됩니다."
        saved_off: "%{name}을(를) 껐습니다. 데이터는 그대로이며 언제든 다시 켤 수 있습니다."
        coming_soon_note: 아직 사용할 수 없습니다. 작동하기 전까지는 켤 수 없습니다.
        settings_note: 설정은 항상 사이드바에 있으며 끌 수 없습니다.
        data_note: 모듈을 끄면 숨겨지기만 합니다. 아무것도 삭제되지 않으며 자동으로 실행되는 작업(정기 거래 기록, 영수증 대조 등)도 계속 실행됩니다.
        sync_note: 이 선택은 이 웹사이트의 계정에 저장됩니다. BillieWeather 앱은 당분간 각자의 선택을 저장합니다.
        empty: 이 필터에 맞는 모듈이 없습니다.
        open_library: 기능 라이브러리 열기
        errors:
          coming_soon: "%{name}은(는) 아직 사용할 수 없습니다."
          unknown: 해당 모듈이 없습니다.
      disabled:
        eyebrow: 기능 라이브러리
        title: "%{name}이(가) 꺼져 있습니다"
        body: 이 모듈은 사이드바에서 숨겨져 있습니다. 데이터는 그대로이며 아무것도 변경되지 않았습니다. 켜면 이 페이지를 다시 사용할 수 있습니다.
        turn_on: "%{name} 켜기"
      add_sync:
        title: 추가 및 동기화
        intro: 거래를 가져오는 모든 방법. 모든 방법이 같은 확인을 거치므로 두 번 계산되지 않습니다.
        available: 사용 가능
        coming_soon: 출시 예정
        connect:
          title: 금융 계좌 연결
          body: 동의를 받아 승인된 금융 데이터 서비스를 통해 은행과 신용카드를 읽기 전용으로 연결합니다.
          note: 아직 사용할 수 없습니다. BillieWeather는 현재 은행과 연결하지 않으며 은행 비밀번호를 요구하지 않습니다.
        import:
          title: 명세서 가져오기
          body: 은행 및 카드 명세서를 업로드하세요. 저장 전에 각 행을 검토할 수 있으며, 이미 가져온 파일은 인식됩니다.
          formats: 웹사이트는 CSV와 텍스트 PDF 명세서를 지원합니다. BillieWeather 앱은 Excel(XLSX), OFX/QFX, 스캔한 PDF도 지원합니다.
          open: 명세서 가져오기
        scan:
          title: 스캔 및 캡처
          body: 영수증 사진, 스크린샷, PDF. 텍스트는 기기에서 또는 PDF에서 읽고, 규칙으로 항목을 인식합니다.
          rules: 기존 은행 거래와 정확하고 유일하게 일치하면 자동으로 연결됩니다. 확인하기 전에는 영수증으로 새 거래가 만들어지지 않습니다.
          open: 영수증 열기
        quick_add:
          title: 빠른 추가
          body: 지출, 수입, 이체, 환불을 직접 입력하세요.
          open: 항목 추가
          manual: 직접 기록
          later: 음성 입력, 자연어 입력, Siri 단축어는 출시 예정입니다.
