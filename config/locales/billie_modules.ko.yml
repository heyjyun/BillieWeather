        saved_shown: "%{name}이(가) 사이드바에 표시됩니다."
        saved_hidden: "%{name}을(를) 사이드바에서 숨겼습니다. 기능은 그대로 작동하며 기능 라이브러리에서 열 수 있습니다."
        coming_soon_note: "개발 중입니다. 작동하게 되면 여기에 표시됩니다."
        unsupported_note: "BillieWeather 앱에서 사용할 수 있습니다. 웹사이트는 아직 지원하지 않습니다."
        hidden_still_works: "사이드바에는 없지만 기능은 그대로 사용 가능"
        settings_note: "설정은 항상 사이드바에 있습니다."
        data_note: "기능을 숨기면 사이드바 항목만 사라집니다. 기능은 그대로 작동하고 아무것도 삭제되지 않으며, 자동으로 실행되는 작업(반복 기록, 영수증 매칭 등)도 계속 실행됩니다."
        sync_note: 이 선택은 이 웹사이트의 계정에 저장됩니다. BillieWeather 앱은 당분간 각자의 선택을 저장합니다.
        empty: 이 필터에 맞는 모듈이 없습니다.
        open_library: 기능 라이브러리 열기
        errors:
          not_available: "%{name}은(는) 여기에서 아직 사용할 수 없습니다."
          invalid: "사이드바에 %{name}을(를) 표시할지 선택하세요."
          unknown: 해당 모듈이 없습니다.
      add_sync:
        title: 추가 및 동기화
        intro: 거래를 가져오는 모든 방법. 모든 방법이 같은 확인을 거치므로 두 번 계산되지 않습니다.
        available: 사용 가능
        coming_soon: 출시 예정
        connect:
          title: 금융 계좌 연결
          body: 동의를 받아 승인된 금융 데이터 서비스를 통해 은행과 신용카드를 읽기 전용으로 연결합니다.
          note: 아직 사용할 수 없습니다. BillieWeather는 현재 은행과 연결하지 않으며 은행 비밀번호를 요구하지 않습니다.
        import:
          title: 명세서 가져오기
          body: 은행 및 카드 명세서를 업로드하세요. 저장 전에 각 행을 검토할 수 있으며, 이미 가져온 파일은 인식됩니다.
          formats: 웹사이트는 CSV와 텍스트 PDF 명세서를 지원합니다. BillieWeather 앱은 Excel(XLSX), OFX/QFX, 스캔한 PDF도 지원합니다.
          open: 명세서 가져오기
        scan:
          title: 스캔 및 캡처
          body: 영수증 사진, 스크린샷, PDF. 텍스트는 기기에서 또는 PDF에서 읽고, 규칙으로 항목을 인식합니다.
          rules: 기존 은행 거래와 정확하고 유일하게 일치하면 자동으로 연결됩니다. 확인하기 전에는 영수증으로 새 거래가 만들어지지 않습니다.
          open: 영수증 열기
        quick_add:
          title: 빠른 추가
          body: 지출, 수입, 이체, 환불을 직접 입력하세요.
          open: 항목 추가
          manual: 직접 기록
          later: 음성 입력, 자연어 입력, Siri 단축어는 출시 예정입니다.
