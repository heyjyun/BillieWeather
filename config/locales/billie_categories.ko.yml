ko:
  billie:
    categories:
      nav: 카테고리
      title: 카테고리
      eyebrow: 지출 정리
      intro: 각 카테고리에 어떤 거래가 있는지 확인하고, 나만의 카테고리를 추가하고, 아직 분류되지 않은 거래는 AI가 정리하도록 하세요.
      ai_eyebrow: 한 번의 클릭
      ai_title: AI로 한 번에 분류
      ai_body:
        one: "미분류 거래가 %{count}건 있습니다. AI가 카테고리를 제안하며, 직접 선택한 카테고리는 절대 바뀌지 않습니다."
        other: "미분류 거래가 %{count}건 있습니다. AI가 각각의 카테고리를 제안하며, 직접 선택한 카테고리는 절대 바뀌지 않습니다."
      ai_consent: "최대 %{max}개 가맹점에 대해 숫자(카드 번호, 참조 번호, 전화번호)를 제거한 거래 설명, 입금/출금 여부, 내 카테고리 이름을 %{service}에 보내는 데 동의합니다. 금액, 날짜, 잔액, 계좌 정보, 이메일은 보내지 않으며 서비스는 요청을 저장하지 않습니다."
      ai_button: AI로 한 번에 분류
      ai_note: 미분류 거래만 업데이트됩니다. 아래에서 결과를 확인하세요. 변경한 내용은 해당 가맹점에 대해 기억됩니다.
      ai_unavailable: AI 분류가 아직 연결되지 않았습니다. 카테고리는 직접 선택할 수 있습니다.
      custom_eyebrow: 나에게 맞게
      custom_title: 나만의 카테고리
      custom_body: "기본 카테고리 외에 최대 %{count}개까지 추가할 수 있습니다. 카테고리를 선택하는 모든 곳과 AI 제안에 표시됩니다."
      new_name: 새 카테고리
      new_placeholder: "예: 육아, 반려동물, 선물"
      add: 카테고리 추가
      all_title: 전체 카테고리
      all_body: 가져온 모든 거래(전체 기간). 제외된 거래는 건수에는 포함되지만 금액에는 포함되지 않습니다.
      col_category: 카테고리
      col_count: 거래 수
      col_spent: 출금
      col_received: 입금
      col_share: 지출 비중
      col_last: 최근
      custom_label: 사용자 지정
      view: 상세
      view_label: "%{name} 상세 보기"
      footnote: 이체는 지출 비중에 포함되지 않습니다.
      detail_eyebrow: 카테고리 상세
      detail_summary:
        one: "거래 %{count}건 · 출금 %{spent} · 입금 %{received}"
        other: "거래 %{count}건 · 출금 %{spent} · 입금 %{received}"
      open_in_transactions: 거래 페이지에서 열기
      rename_label: 카테고리 이름
      rename: 이름 변경
      delete: 카테고리 삭제
      delete_confirm: "‘%{name}’을(를) 삭제할까요? 거래 %{count}건은 미분류가 되고 관련된 기억 규칙도 삭제됩니다."
      detail_more: 전체 %{total}건 중 최근 %{shown}건을 표시합니다. 모두 보려면 거래 페이지에서 여세요.
      detail_empty_title: 이 카테고리에는 아직 거래가 없습니다
      detail_empty_body: 거래에서 이 카테고리를 선택하거나 AI 분류를 실행하세요.
      created: "카테고리 ‘%{name}’을(를) 추가했습니다."
      renamed: "‘%{old}’의 이름을 ‘%{name}’(으)로 변경했습니다."
      deleted:
        one: "카테고리 ‘%{name}’을(를) 삭제했습니다. 거래 %{count}건이 미분류가 되었습니다."
        other: "카테고리 ‘%{name}’을(를) 삭제했습니다. 거래 %{count}건이 미분류가 되었습니다."
      ai_done:
        one: AI가 가맹점 %{sent}곳을 확인하고 거래 %{count}건을 분류했습니다.
        other: AI가 가맹점 %{sent}곳을 확인하고 거래 %{count}건을 분류했습니다.
      ai_remaining:
        one: 가맹점 %{count}곳이 더 남아 있습니다. 다시 실행하면 이어서 진행합니다.
        other: 가맹점 %{count}곳이 더 남아 있습니다. 다시 실행하면 이어서 진행합니다.
      errors:
        blank: 카테고리 이름을 입력하세요.
        too_long: 카테고리 이름은 최대 %{count}자입니다.
        reserved: 이미 기본 카테고리입니다.
        taken: 같은 이름의 카테고리가 이미 있습니다.
        too_many: 나만의 카테고리는 최대 %{count}개까지 만들 수 있습니다.
      ai_errors:
        consent_required: AI를 사용하기 전에 보내는 내용에 동의하는 상자를 선택하세요.
        not_configured: AI 분류가 아직 연결되지 않았습니다.
        nothing_to_do: 사용할 수 있는 설명이 있는 미분류 거래가 없습니다.
        wait: AI 분류가 방금 실행되었습니다. 몇 초 후 다시 시도하세요.
        auth_failed: AI 서비스가 서버의 자격 증명을 거부했습니다. 아무것도 변경되지 않았습니다.
        quota: AI 서비스 크레딧이 부족하거나 현재 혼잡합니다. 아무것도 변경되지 않았습니다.
        failed: AI 서비스가 이 거래들을 분류하지 못했습니다. 아무것도 변경되지 않았습니다. 나중에 다시 시도하세요.
        unavailable: AI 서비스에 연결할 수 없습니다. 아무것도 변경되지 않았습니다. 나중에 다시 시도하세요.
        invalid_result: AI 서비스가 예상하지 못한 응답을 보냈습니다. 아무것도 변경되지 않았습니다. 다시 시도하세요.
