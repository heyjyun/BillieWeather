locales: &locales
  # This is the canonical list of available languages.
  en: English
  zh-CN: 简体中文
  zh-TW: 繁體中文
  ja: 日本語
  ko: 한국어

# The language labels should be the same across all locales.
en:
  locale:
    default: Default
    locales: *locales

zh-CN:
  locale:
    default: 默认
    locales: *locales

ja:
  locale:
    default: 既定
    locales: *locales

zh-TW:
  locale:
    default: 預設
    locales: *locales

ko:
  locale:
    default: 기본값
    locales: *locales
