          title: 扫描与采集
          body: 小票照片、截图和 PDF。文字在你的设备上或从 PDF 中读取，再按规则识别字段。
          rules: 与已有银行交易完全且唯一匹配时会自动关联。在你确认之前，小票绝不会创建新的交易。
          open: 打开小票
        quick_add:
