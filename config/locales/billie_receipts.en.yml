        captured: "%{source} · added %{date}"
        details: Receipt details
        details_help: Values read from the receipt are marked Read or Uncertain until you confirm them. Saving confirms every field shown.
        issues: Please check
        suggest_category: Suggest automatically
        save: Save and check again
        line_items: Items
        item: Item
        quantity: Qty
        unit_price: Unit price
        line_items_note: Items are read from the receipt and kept for reference; totals use the receipt total.
        evidence: Original and matching
        original_alt: Original receipt for %{name}
        open_original: Open original
        download_original: Download
        no_file: No file — this receipt was typed or sent as text.
      duplicate:
        is_copy: This is a copy of a receipt you already added. It isn't counted.
        possible: This looks like a receipt you already added. It isn't counted until you decide.
        confirm: Yes, it's a copy
        different: It's a different purchase
      matching:
        heading: Bank record
        auto_linked: Matched automatically
        linked: Linked
        bank_record: Bank record
        why: Why
        chosen_by_you: chosen by you
        confirm_auto: Confirm match
        undo: Undo link
        superseded_note: The expense recorded from this receipt is set aside, so this purchase counts once — as the bank's transaction.
        question: We found a possible matching bank transaction. Are these records for the same purchase?
        score: "score %{score}"
        confirm: Confirm match
        keep_separate: Keep separate
        review_details: Review details
        none: No matching bank transaction yet. When your statement arrives, it is checked automatically.
        none_cash: Paid in cash — no bank record is expected.
        rejected:
          one: "%{count} suggestion you kept separate"
          other: "%{count} suggestions you kept separate"
        reconsider: Reconsider
      entry:
        heading: In your transactions
        superseded: set aside — the bank's transaction counts instead
        trashed: in the trash
        counted: counted in your totals
        not_recorded: Not recorded as an expense yet.
        record: Record as expense
      link:
        heading: Link to a transaction yourself
        choose: Transaction
        submit: Link
      shortcuts:
        heading: Siri and Shortcuts
        intro: Say "Hey Siri, scan a receipt with BillieWeather" with an iOS Shortcut that photographs the receipt, reads its text on your iPhone and sends it here. A capture token lets the Shortcut add receipts only — it can't read or change anything else.
        copy_now: Copy this token now. It won't be shown again.
        step_token: Create a capture token below and copy it.
        step_actions: In the Shortcuts app, add Take Photo, then Extract Text from Image.
        step_request: "Add Get Contents of URL: POST to %{url}, header Authorization: Bearer <your token>, request body Form with text = the extracted text and file = the photo."
        step_name: Name the Shortcut "Scan a receipt with BillieWeather" so Siri recognizes the phrase.
        native_note: The BillieWeather iPhone app's own Siri actions need the native iOS build; until then, Shortcuts is the supported way.
        name: Token name
        default_name: iPhone Shortcut
        create: Create capture token
        active: active until %{date}
        inactive: revoked or expired
        last_used: last used %{date}
        revoke: Revoke
        revoked: Capture token revoked.
        too_many: You can have up to %{count} active capture tokens. Revoke one first.
      flash:
        too_many: Choose up to %{count} files at a time.
        added: Receipt added.
        already_added: This receipt was already added; nothing new was created.
        batch: "%{added} added, %{existing} already there, %{failed} not added."
        saved: Receipt saved and checked again.
        recorded: Recorded as an expense.
        dismissed: Receipt dismissed.
        reopened: Receipt reopened.
        not_duplicate: Kept as a separate purchase.
        marked_duplicate: Marked as a copy; it isn't counted.
        linked: Receipt linked to the transaction.
        decision:
          confirm: Match confirmed.
          reject: Kept separate. This pair won't be suggested again.
          undo: Link undone. The receipt counts on its own again.
          reconsider: The suggestion is open again.
      transaction:
        heading: Source and verification
        source: Source
        statement: Statement %{name}
        receipt: Receipt
        no_receipt: No receipt attached.
        attach: Add a receipt
        set_aside:
          one: "%{count} receipt entry set aside for this transaction"
          other: "%{count} receipt entries set aside for this transaction"
    reconciliation:
      nav: Reconciliation
      title: Reconciliation
      eyebrow: Verify
      intro: Receipts, bank records and your ledger, checked against each other. Nothing changes until you decide.
      metrics:
        review: Awaiting review
        review_help: Receipts that need your decision
        matched: Matched
        matched_help: Receipts linked to a bank transaction
        unmatched: Unmatched
        unmatched_help: "%{bank} waiting for the bank · %{cash} cash"
        discrepancies: Discrepancies
        discrepancies_help: Records that don't agree
      review:
        heading: Transactions awaiting review
        empty: Nothing to review.
        check_details: Check the details read from this receipt.
      discrepancies:
        heading: Reconciliation discrepancies
        intro: These are listed for a look; none is changed automatically. A second charge can be a real purchase.
        none: No discrepancies found.
        amount_mismatch:
          one: "%{count} receipt differs from its bank charge"
          other: "%{count} receipts differ from their bank charges"
        receipt_vs_bank: "receipt %{receipt}, bank %{bank}"
        duplicate_charges:
          one: "%{count} possible duplicate bank charge"
          other: "%{count} possible duplicate bank charges"
        missing_receipts:
          one: "%{count} tax-review expense without a receipt"
          other: "%{count} tax-review expenses without a receipt"
        refunds_without_purchase:
          one: "%{count} refund not linked to a purchase"
          other: "%{count} refunds not linked to a purchase"
        transfers_as_spending:
          one: "%{count} possible transfer counted as spending"
          other: "%{count} possible transfers counted as spending"
      balances:
        heading: Statement balances
        consistent: Consistent
        differs: Differs by %{amount}
        scope: Balances are compared only between two statements of one account that both show a closing balance. This is a continuity check, not a full bank reconciliation, and it can't see transactions missing from both statements.
      matched:
        heading: Matched transactions
        empty: No matched receipts yet.
      unmatched:
        heading: Unmatched transactions
        intro: Receipts without a bank record. A card purchase can take several days to post; cash never appears.
        awaiting_bank:
          one: "%{count} waiting for the bank"
          other: "%{count} waiting for the bank"
        stale: not seen after %{days} days — check your card statement
        cash:
          one: "%{count} cash purchase"
          other: "%{count} cash purchases"
      verified:
        heading: Recently verified
        empty: Matches you confirm appear here.
