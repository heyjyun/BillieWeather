        exact: Exact match
        probable: Probable match
        ambiguous: Possible match
        manual: Linked by you
      reasons:
        amount_equal: same amount
        amount_differs_tip: the bank charged more (maybe a tip)
        split_payment: two charges add up to the total
        currency_differs: different currency, amounts not compared
        merchant_same: same merchant
        merchant_similar: merchant name written differently
        merchant_weak: merchant name only partly similar
        merchant_unknown: merchant unreadable
        same_day: same day
        posted_later: posted later by the bank
        posted_earlier: posted a day earlier
        card_last4_match: same card
        receipt_number_match: receipt number matches the bank reference
        multiple_candidates: several transactions fit
        similar_candidates: another transaction is similar
        low_confidence: some receipt details are uncertain
      issues:
        merchant_missing: The merchant couldn't be read.
        date_missing: The date couldn't be read.
        total_missing: No total was found.
        total_inferred: No line said "total"; the largest amount was used. Please check it.
        totals_inconsistent: The subtotal, tax and tip don't add up to the total.
        multiple_totals: The receipt shows different totals.
        date_ambiguous: The date could be read either day-first or month-first.
        future_date: The date is in the future.
        currency_assumed: No currency on the receipt; your account's currency is assumed.
        low_confidence: Some details were hard to read.
        text_unavailable: No text could be read from this file. Type the details below.
