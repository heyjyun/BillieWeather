        already_recorded: This receipt is already recorded as an expense.
        receipt_incomplete: Enter the receipt's date and total first.
        currency_mismatch: This receipt is in another currency than your account, so it can't be recorded as an expense. Link it to the bank's charge instead.
        receipt_in_use: This receipt supports a transaction. Undo the link (or delete the entry) first.
        not_a_duplicate: This receipt isn't marked as a duplicate.
        not_dismissed: This receipt isn't dismissed.
