    receipts:
      nav: Receipts
      title: Receipts
      eyebrow: Capture
      intro: Scan paper receipts, upload electronic receipts, screenshots and PDFs. BillieWeather reads them, checks them against your bank records and never counts one purchase twice.
      untitled: Receipt
      entry_note: From a receipt
      back: Back to receipts
      unknown: Unknown
      reopen: Reopen
      dismiss: Dismiss receipt
      dismiss_confirm: Dismiss this receipt? It stays in your records and can be reopened.
      capture:
        heading: Add receipts
        scan: Scan receipt
        scan_help: On a phone this opens the camera. Hold the receipt flat, in good light.
        scan_input: Receipt photo
        scan_submit: Use photo
        upload: Upload receipts
        upload_help: Drop images, screenshots or PDF receipts here, or choose files.
        upload_input: Receipt files
        limits: Up to %{count} files, 10 MB each. JPEG, PNG, HEIC, WebP or PDF.
        upload_submit: Upload
        statement: Import statement
        statement_help: Bank and card statements (CSV or PDF) are matched against your receipts automatically.
        statement_link: Go to statements
        manual: Type a receipt by hand
        manual_submit: Add receipt
      privacy:
        local_ocr: Receipt files are kept privately in your BillieWeather records. Text is recognized on this server with a local engine; receipts are never sent to another service.
        no_server_ocr: Receipt files are kept privately in your BillieWeather records and never sent to another service. The website reads PDF receipts; for photos, type the details or scan with the BillieWeather app or an iOS Shortcut, which recognize text on your phone.
      recent:
        heading: Recent imports
        source: Source
        status: Status
        empty: No receipts yet
        empty_help: Scan or upload a receipt to start.
        statements: Recent statements
        statement_rows:
          one: "%{count} transaction · imported %{date}"
          other: "%{count} transactions · imported %{date}"
      sources:
