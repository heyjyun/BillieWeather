[project]
name = "billieforecast"
version = "0.1.0"
description = "Local cash-flow forecasting API powered by Chronos-2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
chronos = ["chronos-forecasting>=2.3,<3"]

[project.scripts]
billieforecast = "billieforecast.__main__:main"

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
