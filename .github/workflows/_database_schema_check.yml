# This workflow will ensure that when we run `rails db:migrate` that no changes are made to `db/schema.rb`.
#
# This workflow is pimarily meant to be called by other workflows, but it can be run manually.
name: "🔎 ~ Database Schema Check"
on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04 # Ruby 4.0.3 (.ruby-version) has no prebuilt for ubuntu-26.04
    services:
      postgres:
        # Same major version as the Neon database (schema.rb's dump format and SQL behaviour depend on it).
        # Unverified here: confirm with `SHOW server_version` on Neon and update together with the other workflows.
        image: postgres:18-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      # Manually export your local RAILS_MASTER_KEY if using the credentials system.
      # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
      BUNDLE_JOBS: 2
      BUNDLE_RETRY: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Database Schema Check
        id: db-schema-check
        run : ./bin/db_schema_check
        continue-on-error: false
