# Cross-platform client (clients/universal + packages/*). Independent of the Rails
# CI/CD and the Render deploy: it only runs when client code changes, builds
# unsigned artifacts for download, and never publishes to any store.
name: Universal client

on:
  pull_request:
    paths: ["clients/**", "packages/**", ".github/workflows/universal-client.yml"]
  push:
    branches: [main]
    paths: ["clients/**", "packages/**", ".github/workflows/universal-client.yml"]
  workflow_dispatch:
    inputs:
      mobile:
        description: "Also try the iOS and Android builds (experimental)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: clients/universal

jobs:
  test:
    name: Tests (shared logic, storage, UI workflow, privacy guards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/universal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  desktop:
    name: Desktop build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            bundles: app,dmg
          - platform: Windows
            os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/universal/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/universal/src-tauri
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: billieweather-${{ matrix.platform }}-unsigned
          path: |
            clients/universal/src-tauri/target/release/bundle/**/*.dmg
            clients/universal/src-tauri/target/release/bundle/**/*.exe
            clients/universal/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android build (experimental)
    if: github.event_name == 'workflow_dispatch' && inputs.mobile
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/universal/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
      - run: npx tauri android init --ci
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - run: npx tauri android build --debug --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      - uses: actions/upload-artifact@v4
        with:
          name: billieweather-android-debug-apk
          path: clients/universal/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7

  ios:
    name: iOS simulator build (experimental)
    if: github.event_name == 'workflow_dispatch' && inputs.mobile
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/universal/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: npm ci
      - run: npx tauri ios init --ci
      # Simulator build only: device builds need an Apple signing team.
      - run: npx tauri ios build --target aarch64-sim --debug
