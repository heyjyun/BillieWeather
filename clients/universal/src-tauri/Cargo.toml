[package]
name = "billieweather"
version = "0.1.0"
description = "BillieWeather — local-first personal finance"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# staticlib/cdylib are needed for the iOS and Android builds.
name = "billieweather_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
