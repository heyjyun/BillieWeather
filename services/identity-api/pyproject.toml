[project]
name = "billieweather-identity-api"
version = "0.1.0"
description = "BillieWeather in-app registration service (FastAPI). Creates Devise-compatible accounts in the existing database."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "bcrypt>=4.2",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identity_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
