# Render free tier + Neon (free Postgres) + Render Key Value (free Redis).
# The Sidekiq worker is intentionally omitted: Render has no free background worker.
services:
  - type: keyvalue
    name: redis
    plan: free
    ipAllowList: [] # only allow Render-internal connections
    maxmemoryPolicy: noeviction
  - type: web
    name: web
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: ./bin/render-start.sh
    healthCheckPath: /up
    envVars:
      # Pooled Neon URL for a dedicated runtime role. DDL credentials are release-only. Exact form and the
      # other required settings (the password goes after the role): docs/audits/render-neon-release-runbook.md.
      #   postgresql://<role>@<ep-id>-pooler.<region>.aws.neon.tech/<db>?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt
      - key: DATABASE_URL
        sync: false
      - key: BILLIE_DB_ENV
        value: production
      - key: BILLIE_DB_HOST
        sync: false
      - key: BILLIE_DB_NAME
        sync: false
      - key: BILLIE_DB_TARGET_ID
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      - fromGroup: settings
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_ENV
        value: production
      # Optional Google sign-in: add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
      # in this web service's Environment settings after creating a Google OAuth
      # Web application client and registering its HTTPS callback URL.

envVarGroups:
  - name: settings
    envVars:
      - key: HIDE_THINGS
        generateValue: true
      # Never SECRET_KEY_BASE: releases from before server-side sign-ins read that name, and a rollback to
      # one would accept credentials that were signed out. Delete SECRET_KEY_BASE from the group (runbook).
      - key: BILLIE_SECRET_KEY_BASE
        generateValue: true
