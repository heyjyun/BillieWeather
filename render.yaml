# Render free tier + Neon (free Postgres) + Render Key Value (free Redis).
# The Sidekiq worker is intentionally omitted: Render has no free background worker.
services:
  - type: keyvalue
    name: redis
    plan: free
    ipAllowList: [] # only allow Render-internal connections
    maxmemoryPolicy: noeviction
  - type: web
    name: web
    env: ruby
    plan: free
    buildCommand: "RUN_MIGRATIONS=1 ./bin/render-build.sh"
    startCommand: "corepack enable && bundle exec puma -C config/puma.rb"
    envVars:
      # Neon connection string, e.g. postgresql://user:pass@ep-xxx.neon.tech/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      - fromGroup: settings
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_ENV
        value: production

envVarGroups:
  - name: settings
    envVars:
      - key: HIDE_THINGS
        generateValue: true
      - key: SECRET_KEY_BASE
        generateValue: true
