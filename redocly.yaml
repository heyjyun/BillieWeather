# Redocly CLI 2.x reads `redocly.yaml` (1.x also read `.redocly.yaml`).
organization: untitled_application

extends:
  - recommended

apis:
  api@v1:
    root: ./tmp/openapi.yaml
    rules:
      no-ambiguous-paths: off
      # Two rules the 2.x "recommended" set added; 1.x never checked them, so turning them off
      # keeps exactly the coverage the test had before the upgrade.
      # - The test renders the document in the test environment, whose server URL is localhost.
      no-server-example.com: off
      # - 21 examples generated by the Bullet Train API templates do not match their schemas.
      #   A documentation defect to fix at the source (docs/audits/claude-fable-5-2-follow-up-2026-11-16.md, section O).
      no-invalid-schema-examples: off
